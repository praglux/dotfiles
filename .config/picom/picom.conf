backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";

fading = true;
fade-in-step = 0.025;
fade-out-step = 0.025;
fade-delta = 8;

corner-radius = 8;

blur:
{
    method = "dual_kawase";
    strength = 4;
};

rules = (
    {
        match = "class_g = 'dwm'";
        opacity = 0.80;
        blur-background = true;
        shadow = false;
    },

    {
        match = "(class_g = 'st-256color' || class_g = 'kitty' || class_g = 'kitty-yazi' || class_g = 'kitty-moviebox') && focused";
        opacity = 0.75;
        blur-background = true;
        shadow = true;
        corner-radius = 10;
    },

    {
        match = "(class_g = 'st-256color' || class_g = 'kitty' || class_g = 'kitty-yazi' || class_g = 'kitty-moviebox') && !focused";
        opacity = 0.70;
        blur-background = true;
        shadow = true;
        corner-radius = 10;
    }
);

fullscreen = false;
use-damage = true;
detect-client-opacity = true;
detect-rounded-corners = true;
